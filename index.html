<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMINUR FAST FOOD CENTER</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff5e8;text-align:center;color:#29221f}
header{background:linear-gradient(120deg,#991b1b,#f07800);color:white;padding:40px 12px}
h1{font-size:30px}main{padding:20px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:600px;margin:auto}
.item{background:white;padding:22px 8px;border-radius:15px;box-shadow:0 3px 12px #0002}
.icon{font-size:40px}.price{font-size:23px;color:#c62828;font-weight:bold}
footer{background:#241b18;color:white;padding:20px;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>AMINUR FAST FOOD CENTER</h1>
<p>স্বাদে ভরপুর, দামে সাশ্রয়ী!</p>
</header>
<main>
<h2>আমাদের খাবারের মেনু</h2>
<div class="menu">
<div class="item"><div class="icon">🍜</div><h3>চাউমিন</h3><div class="price">₹৫০</div></div>
<div class="item"><div class="icon">🥟</div><h3>মোমো</h3><div class="price">₹৫০</div></div>
<div class="item"><div class="icon">🌯</div><h3>এগ রোল</h3><div class="price">₹৫০</div></div>
<div class="item"><div class="icon">🥞</div><h3>ধোসা</h3><div class="price">₹৫০</div></div>
</div>
</main>
<footer>ধন্যবাদ আমাদের পাশে থাকার জন্য ❤️</footer>
</body>
</html>
